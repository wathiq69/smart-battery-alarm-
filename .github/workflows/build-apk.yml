name: Build APK (Cloud Build)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle 8.3
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.3

    - name: Download gradle-wrapper.jar
      run: |
        mkdir -p gradle/wrapper
        curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar
        ls -la gradle/wrapper/

    - name: Create gradlew script
      run: |
        cat > gradlew << 'EOF'
        #!/bin/sh
        exec gradle "$@"
        EOF
        chmod +x gradlew

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon --stacktrace
      continue-on-error: true

    - name: Upload Debug APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartBatteryAlarm-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 90

    - name: Upload Release APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartBatteryAlarm-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90
        if-no-files-found: ignore
